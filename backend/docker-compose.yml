services:
  db:
    image: postgres:16-alpine
    container_name: pedidos-postgres
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "5432:5432"
    volumes:
      - pedidos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./pedidos
    container_name: pedidos-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pedidos
      DB_USER: pedidos
      DB_PASSWORD: pedidos
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion-esta-clave-secreta-jwt-2026}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend/frontend
    container_name: pedidos-frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pedidos_pg_data:
