spring:
  application:
    name: pedidos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos}
    username: ${DB_USER:pedidos}
    password: ${DB_PASSWORD:pedidos}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-esta-clave-secreta-jwt-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  stock:
    ajuste-maximo-encargado: ${AJUSTE_MAXIMO_ENCARGADO:50}
  pedido:
    reserva-ttl-horas: ${RESERVA_TTL_HORAS:48}
    reserva-ttl-job-ms: ${RESERVA_TTL_JOB_MS:3600000}
